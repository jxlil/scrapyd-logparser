[project]
name = "scrapyd-logparser"
version = "0.1.0-beta"
description = "A tool to parse Scrapyd logs for detailed statistics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "pre-commit",
]

[project.scripts]
scrapyd-logparser = "logparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logparser"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88
